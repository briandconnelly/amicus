name: Upstream watch

on:
  schedule:
    # Daily: kimi, claude, pi, fastmcp and mcp releases past amicus's baselines become
    # issues (docs/WATCHING.md). Codex stays with its own routine.
    - cron: "30 15 * * *"
  workflow_dispatch:

# Least-privilege: nothing at the top level; `watch` reads the repo and files issues, and
# `evaluate` may only dispatch workflows.
permissions: {}

# Never two runs at once: a second run must see the first's issues, or both file the same
# title. Queue rather than cancel, so a run that is filing is never cut off mid-move.
concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: watch upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    outputs:
      filed: ${{ steps.filed.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --frozen
      # Reads npm (`npm view`, preinstalled on the runner) and PyPI, then files through `gh`.
      # Exits 1 when a stream is unknown or a filing failed, which fails the job, so an
      # unchecked stream is never mistaken for an up-to-date one.
      - name: Watch and file issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          uv run --frozen python scripts/check_backend_compat.py watch --file-issues --json \
            --repo "$GITHUB_REPOSITORY" >"$RUNNER_TEMP/watch.json" || status=$?
          cat "$RUNNER_TEMP/watch.json"
          {
            echo "## Upstream watch (exit $status)"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/watch.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Even when the watch failed on one stream, the issues it did file still get evaluated.
      - name: List the backend issues this run filed
        id: filed
        if: ${{ !cancelled() }}
        run: |
          issues=$(jq -c '[.filings[]? | select(.action == "filed" and .number != null
            and (.stream == "kimi" or .stream == "pi" or .stream == "claude")) | .number]' \
            "$RUNNER_TEMP/watch.json" 2>/dev/null) || issues='[]'
          echo "issues=${issues:-[]}" >>"$GITHUB_OUTPUT"

  evaluate:
    name: dispatch release evaluations
    needs: watch
    # An issue filed with GITHUB_TOKEN starts no `issues` workflow, but a dispatch does, so
    # each new kimi, pi or claude issue is handed to backend-release-eval.yml this way.
    # A claude issue moved forward by `edited` is not re-dispatched; dispatch it by hand.
    if: ${{ !cancelled() && needs.watch.outputs.filed != '' && needs.watch.outputs.filed != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch one evaluation per filed issue
        env:
          GH_TOKEN: ${{ github.token }}
          FILED: ${{ needs.watch.outputs.filed }}
        # The evaluation runs from the ref the watch ran from: `main` on the schedule.
        run: |
          set -euo pipefail
          for issue in $(jq -r '.[]' <<<"$FILED"); do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || { echo "::error::not an issue number: $issue"; exit 1; }
            # --ref saves gh a lookup of the default branch, which this token cannot read.
            gh workflow run backend-release-eval.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f issue="$issue"
            echo "dispatched an evaluation of #$issue"
          done
