version: 2
updates:
  # Python dependencies managed by uv (reads pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Group identifiers appear in the PR title, which squash-merges into the
    # commit subject — keep them lowercase/hyphenated so the result stays a
    # valid Conventional Commit (scripts/check_commit_message.py).
    groups:
      python-dev:
        dependency-type: "development"
      python-runtime:
        dependency-type: "production"
    # pyproject.toml caps fastmcp and mcp to a minor line because fastmcp
    # documents breaking changes in minor releases. Widening a cap is a
    # hand-written upgrade PR (#106), so Dependabot is told not to propose the
    # minor or major that would move it; patch releases inside the cap still
    # arrive through the python-runtime group. `ignore` also covers security
    # updates, which changes nothing: the cap already excludes those versions.
    ignore:
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "mcp"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions used in workflows (keeps SHA pins current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    # Majors are deliberately outside the group: excluding them here sends each
    # one as its own PR, so a breaking Action major can be evaluated (and held)
    # without blocking the safe minor/patch bumps batched alongside it.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
