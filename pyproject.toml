[project]
name = "amicus"
version = "0.1.0"
description = "One MCP server for every second-opinion model: consult, review, and delegate with the backend as a parameter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Brian Connelly" }]
keywords = ["mcp", "codex", "kimi", "claude-code", "code-review", "delegation", "second-opinion"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "anyio>=4",
    "pontonier==0.9.0",
    # Minor-line caps: fastmcp documents that breaking changes may land in minor releases.
    # Widening either cap is a deliberate upgrade PR, not a resolver decision.
    "fastmcp>=4.0,<4.1",
    "mcp>=2.1,<2.2",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/briandconnelly/amicus"
Repository = "https://github.com/briandconnelly/amicus"
Issues = "https://github.com/briandconnelly/amicus/issues"

[project.scripts]
amicus-mcp = "amicus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amicus"]

[dependency-groups]
dev = [
    # The tasks spike (M0) needs the real extension; production wiring lands in M5.
    "fastmcp[tasks]>=4.0,<4.1",
    "import-linter>=2",
    "jsonschema>=4.26",
    "prek>=0.4.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7",
    "ruff>=0.15.15",
    "ty>=0.0.1a7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Plan docs' code blocks are illustrative, not this package's code; vendored
# skills carry their own tests/tooling.
extend-exclude = ["docs", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF", "PL", "PT", "TID", "TC", "ARG", "PTH"]
ignore = [
    "PLR0913",  # too-many-args: tool handlers legitimately take many params
    "PLR0917",  # too-many-positional-args: same
    "PLR0911",  # too-many-returns: dispatch/classify handlers branch per error case
    "PLR0912",  # too-many-branches: same
    "PLR2004",  # magic-value: noisy for literals
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004", "S101", "TC001", "TC002", "TC003", "PT006", "PT011", "PT018", "PLC0415", "RUF059", "SLF001"]
# Paid-tool modules: the Annotated Param aliases must stay real runtime imports (FastMCP
# resolves them via get_type_hints to build the input schema, so TC001's "move under
# TYPE_CHECKING" would break tool registration), and most parameters are schema-only in
# this milestone -- accepted for wire compatibility, wired to a backend in a later task.
"src/amicus/tools/consult.py" = ["ARG001", "TC001"]
"src/amicus/tools/review.py" = ["ARG001", "TC001"]
"src/amicus/tools/delegate.py" = ["ARG001", "TC001"]
"src/amicus/tools/dry_run.py" = ["ARG001", "TC001"]
"src/amicus/tools/jobs.py" = ["ARG001", "TC001"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=amicus --cov-report=term-missing --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: live tests requiring a backend CLI; opt in with `pytest -m integration --no-cov`",
]

[tool.coverage.run]
source = ["src/amicus"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.importlinter]
root_package = "amicus"

[[tool.importlinter.contracts]]
name = "backends never import the server layer"
type = "forbidden"
source_modules = ["amicus.backends"]
forbidden_modules = [
    "amicus.tools",
    "amicus.server",
    "amicus.orchestration",
    "amicus.jobs",
    "amicus.middleware",
    "amicus.errors",
    "amicus.registry",
    "amicus.manifest",
]

[[tool.importlinter.contracts]]
name = "orchestration and jobs never import the server layer"
type = "forbidden"
source_modules = ["amicus.orchestration", "amicus.jobs", "amicus._worker"]
forbidden_modules = ["amicus.server", "amicus.tools"]

[[tool.importlinter.contracts]]
name = "tools never import the server module"
type = "forbidden"
source_modules = ["amicus.tools"]
forbidden_modules = ["amicus.server"]
